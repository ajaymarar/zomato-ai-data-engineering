# Local Airflow 3.x (LocalExecutor) on Docker.
#
# Credentials are supplied through airflow/.env and are never committed.
# Copy airflow/example.env to airflow/.env and fill in local values before starting.
#
#   docker compose --env-file .\airflow\.env -f .\airflow\docker-compose.yaml build
#   docker compose --env-file .\airflow\.env -f .\airflow\docker-compose.yaml up -d
#   UI: http://localhost:8080

x-airflow-common: &airflow-common

  build: .

  environment: &airflow-env

    AIRFLOW__CORE__EXECUTOR: LocalExecutor

    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:${AIRFLOW_POSTGRES_PASSWORD}@postgres/airflow

    AIRFLOW__CORE__LOAD_EXAMPLES: "false"

    AIRFLOW__CORE__AUTH_MANAGER: airflow.providers.fab.auth_manager.fab_auth_manager.FabAuthManager

    AIRFLOW__CORE__FERNET_KEY: ""

    # Airflow 3 signs inter-component (execution API) calls with this secret.
    AIRFLOW__API_AUTH__JWT_SECRET: ${AIRFLOW_JWT_SECRET}

    # Tasks reach the Execution API through the api-server service name.
    AIRFLOW__CORE__EXECUTION_API_SERVER_URL: "http://apiserver:8080/execution/"

    # dbt + the AI task read these values from the local .env file.
    SNOWFLAKE_ACCOUNT: ${SNOWFLAKE_ACCOUNT}
    SNOWFLAKE_USER: ${SNOWFLAKE_USER}
    SNOWFLAKE_PASSWORD: ${SNOWFLAKE_PASSWORD}
    SNOWFLAKE_WAREHOUSE: ${SNOWFLAKE_WAREHOUSE}
    SNOWFLAKE_DATABASE: ${SNOWFLAKE_DATABASE}
    SNOWFLAKE_SCHEMA: ${SNOWFLAKE_SCHEMA}

    OPENAI_API_KEY: ${OPENAI_API_KEY}

    SAMPLE_N: ${SAMPLE_N:-5}

    AIRFLOW_CONN_SNOWFLAKE_DEFAULT: '{"conn_type":"snowflake","login":"${SNOWFLAKE_USER}","password":"${SNOWFLAKE_PASSWORD}","schema":"RAW","extra":{"account":"${SNOWFLAKE_ACCOUNT}","warehouse":"ZOMATO_WH","database":"ZOMATO","role":"USERADMIN"}}'

  volumes:

    - ./dags:/opt/airflow/dags

    - ./logs:/opt/airflow/logs

    - ../zomato:/opt/airflow/dbt/zomato

    - ../ai:/opt/airflow/ai

  depends_on:

    postgres:

      condition: service_healthy


services:

  postgres:

    image: postgres:15

    environment:

      POSTGRES_USER: airflow

      POSTGRES_PASSWORD: ${AIRFLOW_POSTGRES_PASSWORD}

      POSTGRES_DB: airflow

    volumes: [pgdata:/var/lib/postgresql/data]

    healthcheck:

      test: ["CMD", "pg_isready", "-U", "airflow"]

      interval: 5s

      retries: 5


  airflow-init:

    <<: *airflow-common

    entrypoint: /bin/bash

    command:

      - -c

      - airflow db migrate && airflow users create --username "${AIRFLOW_ADMIN_USERNAME}" --password "${AIRFLOW_ADMIN_PASSWORD}" --firstname a --lastname b --role Admin --email "${AIRFLOW_ADMIN_EMAIL}"

    depends_on:

      postgres:

        condition: service_healthy


  apiserver:

    <<: *airflow-common

    command: api-server

    ports: ["8080:8080"]

    restart: always

    depends_on:

      airflow-init:

        condition: service_completed_successfully


  scheduler:

    <<: *airflow-common

    command: scheduler

    ports: ["8501:8501"]

    restart: always

    depends_on:

      airflow-init:

        condition: service_completed_successfully


  dag-processor:

    <<: *airflow-common

    command: dag-processor

    restart: always

    depends_on:

      airflow-init:

        condition: service_completed_successfully


volumes:

  pgdata:
